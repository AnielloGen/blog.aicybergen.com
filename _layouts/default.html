
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <style>
    .site-header {
      background-color: #1a202c !important;
      border-top: 4px solid #1a56a0 !important;
      border-bottom: none !important;
    }
    .site-header .wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-logo {
      height: 90px;
      width: auto;
    }
    .site-title, .site-title:visited {
      color: #ffffff !important;
      font-weight: 700 !important;
    }
    .site-nav .page-link {
      color: #ffffff !important;
    }
    .site-banner {
      background-color: #1a56a0;
      color: #ffffff;
      text-align: center;
      padding: 10px 30px;
      font-size: 0.95rem;
    }
    .site-banner a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: underline;
    }
    a { color: #1a56a0; }
    .site-footer {
      background-color: #1a202c !important;
      color: #a0aec0 !important;
      border-top: none !important;
    }
    .site-footer a { color: #90cdf4 !important; }
    .post-content {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #4a5568;
    }
    .post-list > li {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1.2rem;
      margin-bottom: 1.2rem;
    }
    /* ── Card homepage ── */
    .post-list { list-style: none; padding: 0; }
    .post-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #1a56a0;
      border-radius: 6px;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.8rem;
      transition: box-shadow 0.2s;
    }
    .post-card:hover { box-shadow: 0 4px 16px rgba(26,86,160,0.10); }

    /* ── Meta (data + badge + lettura) ── */
    .post-card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 0.6rem;
    }
    .post-date { color: #718096; font-size: 0.85rem; }
    .post-badge {
      background-color: #ebf4ff;
      color: #1a56a0;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .post-read-time { color: #a0aec0; font-size: 0.80rem; margin-left: auto; }

    /* ── Titolo card ── */
    .post-card-title { margin: 0.3rem 0 0.7rem; font-size: 1.25rem; }
    .post-card-title a { color: #1a202c; text-decoration: none; }
    .post-card-title a:hover { color: #1a56a0; }

    /* ── Excerpt ── */
    .post-excerpt { color: #4a5568; font-size: 0.97rem; line-height: 1.7; margin-bottom: 1rem; }

    /* ── Leggi l'articolo ── */
    .read-more {
      display: inline-block;
      color: #1a56a0;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border-bottom: 2px solid #1a56a0;
      padding-bottom: 1px;
    }
    .read-more:hover { color: #0d3a6e; border-color: #0d3a6e; }

    /* ── Articolo interno ── */
    .post-title { font-size: 2rem; color: #1a202c; margin-bottom: 1rem; line-height: 1.3; }
    .post-content h2 {
      color: #1a56a0;
      font-size: 1.35rem;
      margin-top: 2.2rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid #ebf4ff;
    }
    .post-content h3 { color: #2d3748; font-size: 1.1rem; margin-top: 1.5rem; }
    .post-content strong { color: #1a202c; }
    .post-content ul li { margin-bottom: 0.4rem; }
    .post-content blockquote {
      border-left: 4px solid #1a56a0;
      background: #f7faff;
      padding: 0.8rem 1.2rem;
      margin: 1.5rem 0;
      color: #4a5568;
      font-style: italic;
    }
    .post-content hr { border: none; border-top: 1px solid #e2e8f0; margin: 2rem 0; }

    /* ── Footer articolo ── */
    .post-footer { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid #e2e8f0; }
    .back-link { color: #1a56a0; font-weight: 600; text-decoration: none; }
    .back-link:hover { color: #0d3a6e; }

    /* ── Heading homepage ── */
    .post-list-heading { color: #1a202c; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1.5rem; }
  </style>

  <body>

    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">
          <img src="{{ "/logo.png" | relative_url }}" 
               alt="AiCyberGen Logo" 
               class="site-logo">
          {{ site.title }}
        </a>
        <nav class="site-nav">
          <div class="trigger">
            <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
          </div>
        </nav>
      </div>
    </header>

    {%- include banner.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <div style="background-color: #1a56a0; color: #ffffff; text-align: center; padding: 18px 30px; font-size: 0.95rem;">
      Hai domande o vuoi contattarci? Scrivici a 
      <a href="mailto:info@aicybergen.com" 
         style="color: #ffffff; font-weight: 700; text-decoration: underline;">
        info@aicybergen.com
      </a>
    </div>

    {%- include footer.html -%}

  </body>

</html>
