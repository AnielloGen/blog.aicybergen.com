
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <style>
    .site-header {
      background-color: #1a202c !important;
      border-top: 4px solid #1a56a0 !important;
      border-bottom: none !important;
    }
    .site-header .wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-logo {
      height: 90px;
      width: auto;
    }
    .site-title, .site-title:visited {
      color: #ffffff !important;
      font-weight: 700 !important;
    }
    .site-nav .page-link {
      color: #ffffff !important;
    }
    .site-banner {
      background-color: #1a56a0;
      color: #ffffff;
      text-align: center;
      padding: 10px 30px;
      font-size: 0.95rem;
    }
    .site-banner a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: underline;
    }
    a { color: #1a56a0; }
    .site-footer {
      background-color: #1a202c !important;
      color: #a0aec0 !important;
      border-top: none !important;
    }
    .site-footer a { color: #90cdf4 !important; }
    .post-content {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #4a5568;
    }
    .post-list > li {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1.2rem;
      margin-bottom: 1.2rem;
    }
  </style>

  <body>

    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">
          <img src="{{ "/logo.png" | relative_url }}" 
               alt="AiCyberGen Logo" 
               class="site-logo">
          {{ site.title }}
        </a>
        <nav class="site-nav">
          <div class="trigger">
            <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
          </div>
        </nav>
      </div>
    </header>

    {%- include banner.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
