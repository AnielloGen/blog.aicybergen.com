---
layout: default
---

<article class="post h-entry">

  <header class="post-header">
    <div class="post-card-meta">
      <span class="post-date">{{ page.date | date: "%d %b %Y" }}</span>
      {%- for cat in page.categories -%}
      <span class="post-badge">{{ cat }}</span>
      {%- endfor -%}
      <span class="post-read-time">{{ page.content | number_of_words | divided_by: 200 | plus: 1 }} min di lettura</span>
    </div>
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ "/" | relative_url }}" class="back-link">← Torna agli articoli</a>
  </div>

</article>
